name: zombie-run-v2
version: '${version}'
main: cn.oneachina.zombierun.v2.plugin.ZombieRunV2Plugin
api-version: '1.21'
folia-supported: true
prefix: ZombieRunV2
depend:
  - QualityArmory
softdepend:
  - Multiverse-Core
  - PlaceholderAPI
authors: [ oneachina ]

commands:
  zr2:
    description: ZombieRun v2 命令
    usage: /zr2 <help>
    aliases: [zombierun2]
  zr:
    description: ZombieRun v2 v1 兼容命令
    usage: /zr <help>
    aliases: [zombierun]

permissions:
  zombie.run.v2.admin:
    description: 允许使用 ZombieRun v2 管理命令
    default: op
  zombie.run.v2.player:
    description: 玩家基础命令
    default: true
