# ZombieRun v2 MapFlow 示例竞技场配置
# 复制到 plugins/zombie-run-v2/config/arenas/ 后，按实际地图坐标调整。
schema: 2
name: mapflow_demo
world: world
doors:
  flow_door_2:
    number: 2
    mode: normal
    region: [12, 64, 12, 12, 66, 18]
    portal:
      axis: x
      front: positive
      plane: 12.0
      y: [64.0, 66.0]
      transverse: [12.0, 18.0]
    schedule: {open: 10, close: 10}
    fallback-material: STONE
  flow_door_3:
    number: 3
    mode: normal
    region: [14, 64, 14, 14, 66, 20]
    portal:
      axis: x
      front: positive
      plane: 14.0
      y: [64.0, 66.0]
      transverse: [14.0, 20.0]
    schedule: {open: 10, close: 10}
    fallback-material: STONE
  flow_door_4:
    number: 4
    mode: normal
    region: [16, 64, 16, 16, 66, 22]
    portal:
      axis: x
      front: positive
      plane: 16.0
      y: [64.0, 66.0]
      transverse: [16.0, 22.0]
    schedule: {open: 10, close: 10}
    fallback-material: STONE
buttons:
  flow_button_2: {at: [12, 64, 12], mode: normal, door-numbers: [2]}
  flow_button_3: {at: [14, 64, 14], mode: normal, door-numbers: [3]}
  flow_button_4: {at: [16, 64, 16], mode: normal, door-numbers: [4]}
respawns:
  flow_wait: {type: wait, at: [0.0, 64.0, 0.0], yaw: 0.0, pitch: 0.0}
map-flow:
  min-players: 1
  start-delay-seconds: 5
  max-duration-seconds: 120
  mother-release-delay-seconds: 10
  reward-coins-human: 50
  reward-xp-human: 10
  reward-coins-zombie: 30
  reward-xp-zombie: 5
  starter-weapon: ""
  stages:
    s1: {label: 第一扇门, door-numbers: [2], next-stage-id: s2}
    s2: {label: 第二扇门, door-numbers: [3], next-stage-id: s3}
    s3: {label: 终点门, door-numbers: [4]}
  finish: {type: DOOR, door-number: 4}